name: Publicar descargas

# Cada push a main publica una release nueva subiendo el parche de la última
# etiqueta (v1.0.5 -> v1.0.6). Para saltar de versión menor o mayor, empuja tú
# la etiqueta (git tag v1.1.0 && git push --tags) y se publica con ese número;
# las siguientes releases automáticas continúan desde ahí.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Cambios que no tocan el contenido del pack: no merecen release nueva.
    paths-ignore:
      - 'README.md'
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: write

# Las releases se numeran en orden: nunca dos calculando la versión a la vez.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesitamos todas las etiquetas para calcular la versión

      - name: Calcular versión
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif git tag --points-at HEAD | grep -q '^v'; then
            echo "Este commit ya tiene release; no se publica otra."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Versión: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version: '1.22'

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar packwiz
        if: steps.version.outputs.skip != 'true'
        run: go install github.com/packwiz/packwiz@latest

      # Solo en el runner: así el .mrpack muestra la misma versión que la release.
      - name: Exportar .mrpack
        if: steps.version.outputs.skip != 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          sed -i "s/^version = .*/version = \"${tag#v}\"/" pack.toml
          packwiz refresh
          packwiz modrinth export -o Asalith-Fields.mrpack

      # TLauncher no entiende .mrpack, asi que publicamos ademas un ZIP con los
      # mods ya descargados para copiarlos a mano dentro de .minecraft.
      # Se sirve el pack desde el propio runner y no desde GitHub Pages: el
      # despliegue de Pages corre en paralelo y todavía tendría la versión vieja.
      - name: Preparar ZIP de instalacion manual
        if: steps.version.outputs.skip != 'true'
        run: |
          nohup packwiz serve --port 8080 > serve.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/pack.toml > /dev/null && break
            sleep 1
          done
          mkdir -p manual && cd manual
          curl -sSL -o bootstrap.jar \
            https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          java -jar bootstrap.jar -g -s client http://localhost:8080/pack.toml
          rm -f bootstrap.jar packwiz-installer.jar packwiz.json
          if [ -z "$(ls -A)" ]; then
            echo "::warning::El pack no tiene mods todavia; el ZIP manual saldra vacio."
          fi
          zip -r ../Asalith-Fields-manual.zip .

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Asalith-Fields.mrpack
            Asalith-Fields-manual.zip
          generate_release_notes: true
